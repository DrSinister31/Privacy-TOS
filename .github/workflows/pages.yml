name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"
          VERSION="X-GitHub-Api-Version: 2022-11-28"
          BODY='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'

          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "$AUTH" -H "$ACCEPT" -H "$VERSION" \
            "https://api.github.com/repos/${REPO}/pages")
          echo "GET /pages -> ${code}"
          cat /tmp/pages.json
          echo

          if [ "$code" = "404" ]; then
            method=POST
          else
            method=PUT
          fi

          code=$(curl -sS -o /tmp/pages-write.json -D /tmp/pages-write.hdr -w "%{http_code}" \
            -X "$method" \
            -H "$AUTH" -H "$ACCEPT" -H "$VERSION" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d "$BODY")
          echo "${method} /pages -> ${code}"
          cat /tmp/pages-write.hdr
          echo
          cat /tmp/pages-write.json
          echo

          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "204" ]; then
            echo "Pages API write failed"
            exit 1
          fi

          curl -sS -o /tmp/pages-build.json -w "POST /pages/builds -> %{http_code}\n" \
            -X POST \
            -H "$AUTH" -H "$ACCEPT" -H "$VERSION" \
            "https://api.github.com/repos/${REPO}/pages/builds" || true
          cat /tmp/pages-build.json
          echo
